# OpenTelemetry Collector configuration for SPECTRE.
# Receives OTLP (gRPC 4317 / HTTP 4318) from the agent and routes:
#   traces  -> logging (debug)
#   metrics -> Prometheus (scraped on :8889)
#   logs    -> Loki (+ logging)
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s

exporters:
  logging:
    loglevel: info
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: spectre

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [loki, logging]
