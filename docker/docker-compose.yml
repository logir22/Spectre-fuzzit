# SPECTRE local stack: agent + PostgreSQL/pgvector + Ollama.
#
# Before the first run, pull the required models into the ollama service:
#   docker compose up -d db ollama
#   docker compose exec ollama ollama pull qwen2.5-coder
#   docker compose exec ollama ollama pull nomic-embed-text
#
# Place the C/C++ code to scan into ./target (next to this file), then run:
#   docker compose run --rm agent /target
#
# Or override the target path entirely:
#   docker compose run --rm -v /abs/path:/code:ro agent /code

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: spectre
      POSTGRES_PASSWORD: spectre
      POSTGRES_DB: spectre
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spectre -d spectre"]
      interval: 5s
      timeout: 5s
      retries: 12

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Event bus: buffers crash events so the AI worker consumes at its own pace.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Observability: OTel collector -> Loki (logs) + Prometheus (metrics).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config", "/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus scrape endpoint
    depends_on:
      - loki

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: ["-config.file=/etc/loki/local-config.yaml"]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    depends_on:
      - loki
      - prometheus

  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    environment:
      PGVECTOR_CONNECTION: postgresql+psycopg://spectre:spectre@db:5432/spectre
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5-coder:7b
      OLLAMA_EMBED_MODEL: nomic-embed-text
      REPORTS_DIR: /app/reports
      REDIS_URL: redis://redis:6379/0
      OTEL_ENABLED: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      # Strong isolation for fuzzing: set ISOLATION_RUNTIME=gvisor (runsc)
      # after installing the gVisor runtime on the Docker host.
      ISOLATION_RUNTIME: none
    volumes:
      - ../reports:/app/reports
      - ./target:/target:ro
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["/target"]
    stdin_open: true
    tty: true

volumes:
  pgdata:
  ollama:
